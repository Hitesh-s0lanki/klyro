[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "klyro-client"
version = "0.1.0"
description = "Official Python client for Klyro, a Redis-style in-memory data server."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Klyro contributors" }]
keywords = ["klyro", "redis", "database", "client", "tcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/Hitesh-s0lanki/klyro"
Repository = "https://github.com/Hitesh-s0lanki/klyro"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
klyro_client = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
