[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "klyro-db"
version = "0.1.1"
description = "Typed Python client for the Klyro in-memory database"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Hitesh Solanki" }]
dependencies = ["redis>=5,<8"]
keywords = ["klyro", "redis", "database", "memory", "vector", "ai"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/Hitesh-s0lanki/klyro"
Repository = "https://github.com/Hitesh-s0lanki/klyro"
Issues = "https://github.com/Hitesh-s0lanki/klyro/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/klyro_db"]

[tool.pyright]
include = ["src", "tests"]
strict = ["src"]
